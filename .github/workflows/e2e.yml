name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/office-ui/**'
      - 'services/**'
      - 'infra/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/office-ui/**'
      - 'services/**'
      - 'infra/**'
      - '.github/workflows/e2e.yml'

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apps/office-ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/office-ui
        run: npx playwright install --with-deps chromium

      # Production build avoids the per-route JIT compile that `next dev`
      # pays on first hit (a cold /login compile takes ~13s under CI's
      # I/O budget; the previous setup blew the 30s wait-on window and
      # then the 30s test timeout on subsequent first-hit routes).
      # `next build` runs ESLint with stricter defaults than the
      # standalone `lint` job (incl. no-undef for browser globals);
      # E2E doesn't care about that — `--no-lint` skips it. The dedicated
      # lint-and-typecheck job in ci.yml still gates code quality.
      - name: Build office-ui
        working-directory: apps/office-ui
        run: npx next build --no-lint
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Inspect standalone output layout
        working-directory: apps/office-ui
        run: |
          echo "--- top of .next/standalone ---"
          ls -la .next/standalone || true
          echo "--- find server.js inside .next/standalone ---"
          find .next/standalone -maxdepth 5 -name 'server.js' || true
          echo "--- find any .next dirs inside standalone ---"
          find .next/standalone -maxdepth 5 -type d -name '.next' || true
          echo "--- contents of standalone/apps/office-ui (if it exists) ---"
          ls -la .next/standalone/apps/office-ui 2>/dev/null || echo "(missing)"

      # `output: "standalone"` is required for the production Docker image, but
      # `next start` is a no-op under that mode. Launch the standalone server
      # directly. With `outputFileTracingRoot` set in next.config.mjs, the
      # standalone tree is rooted at `.next/standalone/apps/office-ui/` (mirrors
      # the workspace path). The bundle excludes `.next/static` and `public/`,
      # so they're copied alongside server.js before launch — same shape as
      # apps/office-ui/Dockerfile.
      - name: Start production server
        working-directory: apps/office-ui
        run: |
          cp -r .next/static .next/standalone/apps/office-ui/.next/static
          # public/ is empty in this repo (git doesn't track empty dirs, so it
          # is absent in CI checkouts); skip cleanly if it doesn't exist.
          if [ -d public ]; then cp -r public .next/standalone/apps/office-ui/public; fi
          node .next/standalone/apps/office-ui/server.js &
        env:
          PORT: 3000
          HOSTNAME: 0.0.0.0

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000
        working-directory: apps/office-ui

      - name: Run Playwright tests
        working-directory: apps/office-ui
        run: npx playwright test
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/office-ui/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: apps/office-ui/test-results/
          retention-days: 7
