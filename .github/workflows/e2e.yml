name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/office-ui/**'
      - 'services/**'
      - 'infra/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/office-ui/**'
      - 'services/**'
      - 'infra/**'
      - '.github/workflows/e2e.yml'

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apps/office-ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/office-ui
        run: npx playwright install --with-deps chromium

      # Production build avoids the per-route JIT compile that `next dev`
      # pays on first hit (a cold /login compile takes ~13s under CI's
      # I/O budget; the previous setup blew the 30s wait-on window and
      # then the 30s test timeout on subsequent first-hit routes).
      # `next build` runs ESLint with stricter defaults than the
      # standalone `lint` job (incl. no-undef for browser globals);
      # E2E doesn't care about that — `--no-lint` skips it. The dedicated
      # lint-and-typecheck job in ci.yml still gates code quality.
      - name: Build office-ui
        working-directory: apps/office-ui
        run: npx next build --no-lint
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Inspect standalone output layout
        working-directory: apps/office-ui
        run: |
          echo "--- top of .next/standalone ---"
          ls -la .next/standalone || true
          echo "--- find server.js ---"
          find .next/standalone -maxdepth 5 -name 'server.js' || true
          echo "--- find .next dirs ---"
          find .next/standalone -maxdepth 5 -type d -name '.next' || true
          echo "--- find node_modules dirs ---"
          find .next/standalone -maxdepth 3 -type d -name 'node_modules' || true
          echo "--- find apps subtree ---"
          find .next/standalone -maxdepth 3 -type d -name 'apps' -o -name 'office-ui' || true

      # `output: "standalone"` is required for the production Docker image, but
      # `next start` is a no-op under that mode. Launch the standalone server
      # directly. The bundle excludes `.next/static` and `public/`, so they
      # are copied alongside server.js before launch.
      - name: Start production server
        working-directory: apps/office-ui
        run: |
          set -x
          # Create parent dirs proactively in case the standalone layout omits them
          SERVER_JS=$(find .next/standalone -maxdepth 5 -name 'server.js' | head -1)
          SERVER_DIR=$(dirname "$SERVER_JS")
          echo "server.js found at: $SERVER_JS (dir: $SERVER_DIR)"
          mkdir -p "$SERVER_DIR/.next"
          cp -r .next/static "$SERVER_DIR/.next/static"
          if [ -d public ]; then cp -r public "$SERVER_DIR/public"; fi
          node "$SERVER_JS" &
        env:
          PORT: 3000
          HOSTNAME: 0.0.0.0

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000
        working-directory: apps/office-ui

      - name: Run Playwright tests
        working-directory: apps/office-ui
        run: npx playwright test
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/office-ui/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: apps/office-ui/test-results/
          retention-days: 7
