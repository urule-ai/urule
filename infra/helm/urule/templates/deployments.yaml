{{/*
Deployment manifests — one per enabled entry in .Values.services.

Each Deployment shares the chart-wide labels + a per-service
component label, exposes /healthz on the configured port for both
liveness and readiness probes, and inherits global env (NATS_URL,
KEYCLOAK_URL, etc.) before per-service env overrides are applied.

DATABASE_URL is rendered only when .databaseName is set on the
service entry — services without a Postgres schema don't get a
stray env var.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "urule.labels" $ | nindent 4 }}
    {{- include "urule.serviceLabels" (dict "name" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "urule.labels" $ | nindent 8 }}
        {{- include "urule.serviceLabels" (dict "name" $name) | nindent 8 }}
        {{- with $.Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $.Values.global.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "urule.serviceAccountName" $ }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "urule.image" (dict "image" $svc.image "ctx" $) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ $svc.port | default 3000 }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ $svc.port | default 3000 | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: NATS_URL
              value: {{ $.Values.global.natsUrl | quote }}
            - name: KEYCLOAK_URL
              value: {{ $.Values.global.keycloakUrl | quote }}
            - name: OPENFGA_URL
              value: {{ $.Values.global.openfgaUrl | quote }}
            {{- with $.Values.global.corsOrigins }}
            - name: CORS_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            {{- $dburl := include "urule.databaseUrl" (dict "databaseName" $svc.databaseName "ctx" $) }}
            {{- if $dburl }}
            - name: DATABASE_URL
              value: {{ $dburl | quote }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
{{- end }}
{{- end }}
