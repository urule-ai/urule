include:
  - docker-compose.infra.yaml

# Anchor reused below; redefined here because docker-compose `include:` does
# not propagate YAML anchors across files.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # Postgres only needs database creation; per-service schemas are applied by
  # the *-migrate one-shot services below using drizzle-kit.
  postgres:
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql

  registry-migrate:
    build:
      context: ../..
      dockerfile: services/registry/Dockerfile
      target: migrator
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://urule:urule@postgres:5432/registry
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  registry:
    build:
      context: ../..
      dockerfile: services/registry/Dockerfile
    logging: *default-logging
    ports:
      - '${URULE_REGISTRY_PORT:-3001}:3000'
    environment:
      PORT: '3000'
      HOST: '0.0.0.0'
      DATABASE_URL: postgres://urule:urule@postgres:5432/registry
      NATS_URL: nats://nats:4222
    depends_on:
      registry-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  langgraph-adapter:
    build:
      context: ../../../orchestrator-adapters/langgraph-adapter
      dockerfile: Dockerfile
    logging: *default-logging
    ports:
      - '${URULE_ADAPTER_PORT:-3002}:3000'
    environment:
      PORT: '3000'
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:3000
      LANGGRAPH_SERVER_URL: http://localhost:8123
    depends_on:
      registry:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  runtime-broker:
    build:
      context: ../../../runtime-broker
      dockerfile: Dockerfile
    logging: *default-logging
    ports:
      - '${URULE_BROKER_PORT:-4500}:4500'
    environment:
      PORT: '4500'
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:3000
    depends_on:
      registry:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:4500/healthz').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  e2e-tests:
    build:
      context: ../e2e
      dockerfile: Dockerfile
    logging: *default-logging
    environment:
      REGISTRY_URL: http://registry:3000
      ADAPTER_URL: http://langgraph-adapter:3000
      BROKER_URL: http://runtime-broker:4500
    depends_on:
      registry:
        condition: service_healthy
      langgraph-adapter:
        condition: service_healthy
      runtime-broker:
        condition: service_healthy
    profiles:
      - test
