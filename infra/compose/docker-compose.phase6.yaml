###############################################################################
# Phase 6: End-to-End UX Test Stack
#
# Boots the full stack for the UX test scenario:
# - Infrastructure: PostgreSQL, NATS
# - Services: Registry, Adapter (Anthropic), Approvals, State, PackageHub
# - Frontend: Office UI
#
# Usage:
#   docker compose -f docker-compose.phase6.yaml up --build
#   Open http://localhost:3000
###############################################################################

include:
  - docker-compose.infra.yaml

# Anchor reused below; redefined here because docker-compose `include:` does
# not propagate YAML anchors across files.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # Postgres + NATS are inherited verbatim from docker-compose.infra.yaml
  # via the `include:` directive above. We don't redefine them here —
  # older docker-compose versions (the one CI runs) treat re-declared
  # included services as conflicts; newer versions merge them silently.
  # The infra file is the single source of truth.
  #
  # Per-service schemas are applied by the *-migrate one-shot services
  # below using drizzle-kit; seed data is loaded by the *-seed one-shot
  # services that run after each migrator.

  # ── Core Services ──────────────────────────────────────────────────────────

  registry-migrate:
    build:
      context: ../..
      dockerfile: services/registry/Dockerfile
      target: migrator
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://urule:${POSTGRES_PASSWORD:?}@postgres:5432/registry
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  packagehub-migrate:
    build:
      context: ../..
      dockerfile: services/packagehub/Dockerfile
      target: migrator
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://urule:${POSTGRES_PASSWORD:?}@postgres:5432/packagehub
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  packages-migrate:
    build:
      context: ../..
      dockerfile: services/packages/Dockerfile
      target: migrator
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://urule:${POSTGRES_PASSWORD:?}@postgres:5432/packages
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Seed jobs — idempotent (INSERT ... ON CONFLICT DO NOTHING). Run after
  # each schema migrator completes, populating demo data so first-boot users
  # see something. Safe to re-run; safe to remove from the stack if not wanted.
  registry-seed:
    image: postgres:16-alpine
    logging: *default-logging
    volumes:
      - ./seed-registry.sql:/seed.sql:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    entrypoint: ['psql', '-h', 'postgres', '-U', 'urule', '-d', 'registry', '-v', 'ON_ERROR_STOP=1', '-f', '/seed.sql']
    depends_on:
      registry-migrate:
        condition: service_completed_successfully
    restart: 'no'

  # Backfills OpenFGA ownership tuples for the seeded demo org/workspace so
  # resource-level authz works from first boot. Idempotent — the registry also
  # runs this backfill on its own startup; this one-shot makes it explicit.
  registry-authz-seed:
    build:
      context: ../..
      dockerfile: services/registry/Dockerfile
    logging: *default-logging
    entrypoint: ['node', 'dist/authz-backfill.js']
    environment:
      DATABASE_URL: postgres://urule:${POSTGRES_PASSWORD:?}@postgres:5432/registry
      OPENFGA_URL: http://openfga:8080
      NATS_URL: nats://nats:4222
    depends_on:
      registry-seed:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
    restart: 'no'

  packagehub-seed:
    image: postgres:16-alpine
    logging: *default-logging
    volumes:
      - ./seed-packagehub.sql:/seed.sql:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    entrypoint: ['psql', '-h', 'postgres', '-U', 'urule', '-d', 'packagehub', '-v', 'ON_ERROR_STOP=1', '-f', '/seed.sql']
    depends_on:
      packagehub-migrate:
        condition: service_completed_successfully
    restart: 'no'

  registry:
    build:
      context: ../..
      dockerfile: services/registry/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - '${URULE_REGISTRY_PORT:-3001}:3000'
    environment:
      # The bundled Keycloak (infra.yaml) isn't wired to these services — none
      # set KEYCLOAK_REALM_URL pointing at it — so JWKS is unreachable and the
      # middleware fails closed. Skip auth explicitly to keep `make dev` usable.
      SKIP_AUTH: 'true'
      PORT: '3000'
      HOST: '0.0.0.0'
      DATABASE_URL: postgres://urule:${POSTGRES_PASSWORD:?}@postgres:5432/registry
      NATS_URL: nats://nats:4222
      ADAPTER_URL: http://adapter:3000
      # Resource-level authz (OpenFGA). The registry self-bootstraps the store +
      # model on startup; unset this to fall back to in-memory mock authz.
      OPENFGA_URL: http://openfga:8080
    depends_on:
      registry-migrate:
        condition: service_completed_successfully
      registry-seed:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      openfga:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adapter:
    build:
      context: ../../..
      dockerfile: orchestrator-adapters/langgraph-adapter/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - '${URULE_ADAPTER_PORT:-3002}:3000'
    environment:
      SKIP_AUTH: 'true' # dev stack has no Keycloak — see registry above
      PORT: '3000'
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:3000
      APPROVALS_URL: http://approvals:3000
      STATE_URL: http://state:3000
      LANGGRAPH_SERVER_URL: http://localhost:8123
    depends_on:
      registry:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  approvals:
    build:
      context: ../../..
      dockerfile: approvals/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - '${URULE_APPROVALS_PORT:-3003}:3000'
    environment:
      SKIP_AUTH: 'true' # dev stack has no Keycloak — see registry above
      PORT: '3000'
      NATS_URL: nats://nats:4222
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      nats:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  state:
    build:
      context: ../..
      dockerfile: services/state/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - '${URULE_STATE_PORT:-3007}:3000'
    environment:
      SKIP_AUTH: 'true' # dev stack has no Keycloak — see registry above
      PORT: '3000'
      NATS_URL: nats://nats:4222
      # Resource-level authz (OpenFGA) — shares the `urule` store the registry
      # self-bootstraps; unset to fall back to in-memory mock authz.
      OPENFGA_URL: http://openfga:8080
    depends_on:
      nats:
        condition: service_healthy
      openfga:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  channel-router:
    build:
      context: ../../..
      dockerfile: channel-router/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - '${URULE_CHANNEL_ROUTER_PORT:-3006}:3000'
    environment:
      SKIP_AUTH: 'true' # dev stack has no Keycloak — see registry above
      PORT: '3000'
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:3000
    depends_on:
      registry:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  runtime-broker:
    build:
      context: ../../..
      dockerfile: runtime-broker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - '${URULE_BROKER_PORT:-4500}:4500'
    environment:
      SKIP_AUTH: 'true' # dev stack has no Keycloak — see registry above
      PORT: '4500'
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:3000
    depends_on:
      registry:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:4500/healthz').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mcp-gateway-migrate:
    build:
      context: ../../..
      dockerfile: mcp-gateway/Dockerfile
      target: migrator
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://urule:${POSTGRES_PASSWORD:?}@postgres:5432/mcp_gateway
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  mcp-gateway:
    build:
      context: ../../..
      dockerfile: mcp-gateway/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - '${URULE_MCP_GATEWAY_PORT:-3005}:3000'
    environment:
      SKIP_AUTH: 'true' # dev stack has no Keycloak — see registry above
      PORT: '3000'
      DATABASE_URL: postgres://urule:${POSTGRES_PASSWORD:?}@postgres:5432/mcp_gateway
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:3000
    depends_on:
      mcp-gateway-migrate:
        condition: service_completed_successfully
      registry:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  packagehub:
    build:
      context: ../..
      dockerfile: services/packagehub/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - '${URULE_PACKAGEHUB_PORT:-3009}:3000'
    environment:
      SKIP_AUTH: 'true' # dev stack has no Keycloak — see registry above
      PORT: '3000'
      DATABASE_URL: postgres://urule:${POSTGRES_PASSWORD:?}@postgres:5432/packagehub
    depends_on:
      packagehub-migrate:
        condition: service_completed_successfully
      packagehub-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  packages:
    build:
      context: ../..
      dockerfile: services/packages/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - '${URULE_PACKAGES_PORT:-3008}:3000'
    environment:
      SKIP_AUTH: 'true' # dev stack has no Keycloak — see registry above
      PORT: '3000'
      HOST: '0.0.0.0'
      DATABASE_URL: postgres://urule:${POSTGRES_PASSWORD:?}@postgres:5432/packages
      PACKAGEHUB_URL: http://packagehub:3000
      NATS_URL: nats://nats:4222
    depends_on:
      packages-migrate:
        condition: service_completed_successfully
      packagehub:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Frontend ───────────────────────────────────────────────────────────────

  office-ui:
    build:
      context: ../..
      dockerfile: apps/office-ui/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - '${URULE_UI_PORT:-3000}:3000'
    environment:
      PORT: '3000'
      NEXT_PUBLIC_REGISTRY_URL: http://localhost:${URULE_REGISTRY_PORT:-3001}
      NEXT_PUBLIC_ADAPTER_URL: http://localhost:${URULE_ADAPTER_PORT:-3002}
      NEXT_PUBLIC_APPROVALS_URL: http://localhost:${URULE_APPROVALS_PORT:-3003}
      NEXT_PUBLIC_STATE_URL: http://localhost:${URULE_STATE_PORT:-3007}
      NEXT_PUBLIC_PACKAGEHUB_URL: http://localhost:${URULE_PACKAGEHUB_PORT:-3009}
    depends_on:
      registry:
        condition: service_healthy
