global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'urule-services'
    metrics_path: /metrics
    static_configs:
      - targets:
          - registry:3000
          - packagehub:3000
          - state:3000
          - adapter:3000        # langgraph-adapter, named `adapter` in compose
          - approvals:3000
          - channel-router:3000
          - mcp-gateway:3000
        labels:
          tier: 'core'
      - targets:
          - runtime-broker:4500
        labels:
          tier: 'core'
